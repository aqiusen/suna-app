name: Desktop Windows Wails

# Builds the Wails Windows desktop zip with bundled Runtime.
# workflow_dispatch appears in the UI after this file reaches the default branch.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Version written into Suna and the zip name
        required: true
        default: v0.20.1
      runtime_tag:
        description: Suna Runtime GitHub release tag to bundle
        required: true
        default: v0.20.1

permissions:
  contents: read

jobs:
  windows:
    name: Build bundled Windows Wails zip
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ inputs.app_version || github.ref_name }}
      RUNTIME_TAG: ${{ inputs.runtime_tag || 'v0.20.1' }}
      SUNA_RUNTIME_REPO: aqiusen/suna
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          check-latest: true
          cache: false

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download Windows runtime
        shell: bash
        run: |
          set -euo pipefail
          dest="$PWD/.runtime/windows-amd64/suna.exe"
          bash ./scripts/fetch-suna-runtime.sh "${RUNTIME_TAG}" windows amd64 "$dest"
          echo "SUNA_RUNTIME=$dest" >> "$GITHUB_ENV"
          echo "Bundling Runtime: $dest"

      - name: Build Windows Wails zip
        shell: bash
        run: bash ./scripts/build-wails-desktop.sh "${APP_VERSION}" windows amd64

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum v*-suna-wails-windows-amd64.zip > desktop-windows-checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_VERSION }}-suna-wails-windows-amd64
          path: |
            dist/v*-suna-wails-windows-amd64.zip
            dist/desktop-windows-checksums.txt
          if-no-files-found: error
