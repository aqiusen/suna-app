name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          check-latest: true
          cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        working-directory: frontend
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm format:check

      - name: Verify Gateway
        working-directory: gateway
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race ./...
      - name: Build release artifacts
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"

      # 桌面一体包：从 Runtime 的公开 GitHub Release 取 darwin 二进制，不编译 suna 源码。
      # 钉死版本，避免 App 与 Runtime 漂到不兼容的 protocol。
      # macOS runner 自带 hdiutil/zip，用于把 Suna.app 打成 dmg。
      - name: Build darwin desktop sidecar dmg
        env:
          SUNA_RUNTIME_REPO: alanchenchen/suna
          SUNA_RUNTIME_TAG: v0.21.0
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            dest="${RUNNER_TEMP}/suna-runtime/darwin-${arch}/suna"
            bash ./scripts/fetch-suna-runtime.sh "${SUNA_RUNTIME_TAG}" darwin "${arch}" "$dest"
            SKIP_FRONTEND_BUILD=1 SUNA_RUNTIME="$dest" bash ./scripts/build-desktop.sh "${GITHUB_REF_NAME}" darwin "${arch}"
          done

      - name: Generate checksums
        working-directory: dist
        # macOS 无 sha256sum，用 shasum -a 256（macOS 自带）。
        run: shasum -a 256 v* > checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/v*
            dist/checksums.txt

  windows:
    name: Build bundled Windows setup
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.ref_name }}
      RUNTIME_TAG: v0.21.0
      SUNA_RUNTIME_REPO: alanchenchen/suna
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          check-latest: true
          cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Download Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeDir = Join-Path $env:RUNNER_TEMP "suna-runtime-windows-amd64"
          $zipPath = Join-Path $env:RUNNER_TEMP "suna-runtime-windows-amd64.zip"
          $url = "https://github.com/$env:SUNA_RUNTIME_REPO/releases/download/$env:RUNTIME_TAG/suna-windows-amd64.zip"

          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $runtimeDir -Force

          $runtime = Join-Path $runtimeDir "suna.exe"
          if (-not (Test-Path -LiteralPath $runtime)) {
            throw "Runtime zip missing suna.exe: $url"
          }
          "SUNA_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Bundling Runtime: $runtime"

      - name: Build Windows setup
        shell: pwsh
        run: .\scripts\build-desktop.ps1 -AppVersion $env:APP_VERSION -Goarch amd64

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash "dist\SunaSetup-*-windows-amd64.exe", "dist\*-suna-desktop-windows-amd64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path)" } |
            Set-Content -Path "dist\desktop-windows-checksums.txt"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SunaSetup-*-windows-amd64.exe
            dist/*-suna-desktop-windows-amd64.zip
            dist/desktop-windows-checksums.txt
